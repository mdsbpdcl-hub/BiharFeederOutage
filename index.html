<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bihar 11 kV Feeder Outage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#1d2433; --ink2:#667085; --muted:#667085; --faint:#98a2b3; --line:#e7eaf0; --track:#eef0f5; --page:#f5f6fa; --card:#ffffff;
  --shadow:0 1px 2px rgba(29,36,51,.04),0 10px 28px -14px rgba(29,36,51,.22);
  --shadow-up:0 2px 4px rgba(29,36,51,.05),0 18px 34px -14px rgba(29,36,51,.30);
  /* the two DISCOMs: fixed */
  --sb:#2a78d6; --nb:#eb6834;
  /* status: fixed. mark / text / tint / edge */
  --good:#22a35a;    --good-t:#1a8a4c;    --good-bg:#eaf8f0;    --good-bd:#bfe6cf;
  --warn:#e3a21a;    --warn-t:#9a6400;    --warn-bg:#fff7e4;    --warn-bd:#f3dca2;
  --serious:#df4b3f; --serious-t:#b8352b; --serious-bg:#fff0ee; --serious-bd:#f5c6c1;
  --crit:#9e2a22;    --crit-t:#86211b;    --crit-bg:#fbe7e5;    --crit-bd:#e7b2ad;
  --nodata:#a3abbb;  --nodata-t:#6b7385;  --nodata-bg:#f4f5f8;  --nodata-bd:#e3e6ed;
  /* measures: fixed */
  --m-ev:#5b6ee1;  --m-ev-bg:#eef0fd;
  --m-fd:#0f9f8f;  --m-fd-bg:#e5f6f3;
  --m-ov:#c8438f;  --m-ov-bg:#fbedf5;
  --m-mpi:#a25ad9; --m-mpi-bg:#f6eefc;
  /* feeder types: fixed */
  --ft1:#0f9f8f; --ft2:#5b6ee1; --ft3:#a25ad9; --ft4:#c8438f;
  /* theme (Sunrise until the page sets the chosen one) */
  --t1:#f0752f; --t2:#f7a531; --t1a:rgba(240,117,47,.16); --t2a:rgba(247,165,49,.14); --t1s:rgba(240,117,47,.09);
  --r1:#f9c3a2; --r2:#f6a679; --r3:#f38a51; --r4:#f0752f; --r5:#c86330; --r6:#a15231; --r7:#7a4132;
  --q1:#fbd6a0; --q2:#f9be6a; --q3:#f7a531; --q4:#cb8a32; --q5:#9f6f33;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{color:var(--ink);font:15px/1.45 "Outfit","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh;
  background:
    radial-gradient(900px 560px at 0% -8%, var(--t1a), transparent 62%),
    radial-gradient(820px 520px at 100% 0%, var(--t2a), transparent 60%),
    radial-gradient(1000px 640px at 55% 112%, var(--t1s), transparent 62%),
    var(--page);
  background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-left:24px;padding-right:24px}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid rgba(231,234,240,.8)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:11px;padding-bottom:11px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.bolt{flex:none;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--t1),var(--t2));display:grid;place-items:center;box-shadow:0 8px 18px -4px var(--t1a)}
.bolt svg{width:22px;height:22px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
.datepill{margin-top:2px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg{display:inline-flex;background:var(--track);border-radius:999px;padding:4px;gap:2px}
.seg:empty{display:none}
.seg button{border:0;background:transparent;color:var(--ink2);padding:7px 16px;border-radius:999px;font-weight:600;cursor:pointer;min-height:36px;transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(29,36,51,.08),0 4px 10px -4px rgba(29,36,51,.18)}
.swatches{display:inline-flex;gap:8px;align-items:center;padding:0 2px}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:transform .2s,box-shadow .2s}
.swatches button:hover{transform:scale(1.08)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.refresh{border:0;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;cursor:pointer;color:#fff;font-weight:600;
  background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 8px 16px -8px var(--t1)}
.refresh svg{width:17px;height:17px;transition:transform .6s}
.refresh.spin svg{transform:rotate(360deg)}
.refresh:hover{filter:brightness(1.05)}
.pdfwrap{position:relative}
.pdfbtn{border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.pdfbtn:hover{background:#f6f7fb}
.pdfbtn svg{width:17px;height:17px;color:var(--t1)}
.pdfbtn svg.chev{width:13px;height:13px;color:var(--ink2)}
.pdfmenu{position:absolute;right:0;top:46px;z-index:40;width:310px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 4px rgba(29,36,51,.06),0 18px 40px -16px rgba(29,36,51,.35);padding:6px}
.pdfmenu button{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer}
.pdfmenu button:hover,.pdfmenu button:focus-visible{background:#f6f7fb}
.pdfmenu .pi{flex:none;width:34px;height:34px;border-radius:10px;background:var(--t1a);color:var(--t1);display:grid;place-items:center}
.pdfmenu .pi svg{width:18px;height:18px}
.pdfmenu b{display:block;font-size:14px;font-weight:600}
.pdfmenu .s{display:block;font-size:12px;color:var(--ink2);line-height:1.3;margin-top:1px}
.pages{display:inline-flex;flex-wrap:wrap;gap:4px;margin-bottom:18px;background:var(--track);border-radius:14px;padding:4px;max-width:100%}
.pages[hidden]{display:none}
.pages button{border:0;background:transparent;padding:9px 20px;border-radius:11px;font-weight:600;color:var(--ink2);cursor:pointer;min-height:40px;font-size:15px}
.pages button:hover{color:var(--ink)}
.pages button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(29,36,51,.08),0 4px 10px -4px rgba(29,36,51,.18)}
.pdfgo{margin-left:auto;display:inline-flex;align-items:center;gap:7px}
.pdfgo svg{width:16px;height:16px}
.bsec{margin-top:22px}
.bhead{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:4px}
.bhead .dot{width:12px;height:12px;background:var(--dc)}
.bhead h2{font-size:21px;font-weight:700;letter-spacing:-.3px}
.bcard{margin-top:12px;border-left:5px solid var(--dc)}
.brow{display:grid;grid-template-columns:32px minmax(0,1.15fr) 150px minmax(0,1.6fr);gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.bcard .brow:nth-child(3){margin-top:6px}
.brow .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--serious-bg);color:var(--serious-t)}
.brow .t1{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.brow .t1.link{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.brow .t1.link:hover{text-decoration-color:var(--t1)}
.brow .t2{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.35}
.bv{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.bv b{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.bv .chip{padding:2px 9px;font-size:11.5px}
.bvs{font-size:12px;color:var(--ink2)}
.cboxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;min-width:0;max-width:640px}
.cbox{background:#f7f8fb;border:1px solid var(--line);border-radius:12px;padding:7px 10px;min-width:0;display:block;color:inherit;text-decoration:none}
a.cbox{cursor:pointer;transition:border-color .15s,background .15s}
a.cbox:hover{border-color:var(--t1);background:#fff}
.crole{font-size:11.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.cnum{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.call{display:inline-flex;align-items:center;gap:5px;color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;text-decoration:none;white-space:nowrap;min-height:30px}
.call svg{width:14px;height:14px}
.call:hover{filter:brightness(1.05)}
.cnone{font-size:12.5px;color:var(--faint);margin-top:4px}
.cname{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.25;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);z-index:95;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 2px 4px rgba(29,36,51,.06),0 18px 40px -16px rgba(29,36,51,.35);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));border-radius:999px;padding:5px 13px;font-weight:600;text-decoration:none;white-space:nowrap}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--t1);outline-offset:2px}

main.wrap{padding-top:22px;padding-bottom:48px}
.sec{margin-top:28px}
.sechead{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.sechead h2{font-size:19px;font-weight:700;letter-spacing:-.2px}
.count{font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.card{background:var(--card);border:1px solid rgba(231,234,240,.7);border-radius:18px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{font-size:15px;font-weight:600;color:var(--ink)}
.card .sub3{font-size:12.5px;color:var(--ink2);margin-top:1px}

/* ---------- dial + KPI tiles ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);gap:16px}
.dialcard{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px 18px}
.dialbox{position:relative;width:100%;max-width:380px}
.dialbox svg{display:block;width:100%;height:auto;overflow:visible}
.needle{transition:transform 1.3s cubic-bezier(.3,1.25,.4,1)}
.arcv{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.dialval{text-align:center;margin-top:6px}
.dialval .v{font-size:58px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.dialval .u{font-size:13px;font-weight:500;color:var(--ink2);margin-left:6px;letter-spacing:0}
.dialval .l{font-size:14px;font-weight:500;color:var(--ink2);margin-top:6px}
.chiprow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpi{border-radius:18px;padding:16px 16px 12px;display:flex;flex-direction:column;min-height:150px;min-width:0;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#fff 35%,var(--kt));border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
.kpi .kh{display:flex;align-items:center;gap:10px}
.kpi .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--kc);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -6px var(--kc)}
.kpi .ico svg{width:21px;height:21px}
.kpi .lab{font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.25}
.kpi .val{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--ink2)}
.kpi .move{align-self:flex-start;margin-top:7px;font-size:12px;font-weight:600;color:var(--kc);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.spark{flex:1 1 40px;min-height:34px;margin:8px -16px -12px;position:relative}
.spark svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.k-ev{--kc:var(--m-ev);--kt:var(--m-ev-bg)}
.k-fd{--kc:var(--m-fd);--kt:var(--m-fd-bg)}
.k-ov{--kc:var(--m-ov);--kt:var(--m-ov-bg)}
.k-mpi{--kc:var(--m-mpi);--kt:var(--m-mpi-bg)}

/* ---------- small fact tiles ---------- */
.facts6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:16px}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid rgba(231,234,240,.7);display:flex;gap:11px;align-items:flex-start;min-width:0}
.stat .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--t1a);color:var(--t1);display:grid;place-items:center}
.stat .ic svg{width:18px;height:18px}
.stat .l{font-size:12.5px;font-weight:500;color:var(--ink2);line-height:1.25}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--ink2)}

/* ---------- DISCOM cards ---------- */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.dcard{display:flex;flex-direction:column;text-align:left;width:100%;cursor:pointer;position:relative;overflow:hidden;padding:16px 18px 14px 25px;transition:transform .2s,box-shadow .2s}
.dcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--dc)}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-up)}
.dtop{display:flex;align-items:center;gap:16px}
.dcard .mini{flex:none;width:124px}
.dcard .mini svg{display:block;width:100%;height:auto;overflow:visible}
.dcard .mv{text-align:center;font-size:21px;font-weight:700;margin-top:-2px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.dname{font-size:16px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dc);display:inline-block;flex:none}
.mbars{flex:1;min-width:0;display:grid;gap:8px}
.mbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12.5px;color:var(--ink2);align-items:end}
.mbar b{color:var(--ink);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.mbar .trk{grid-column:1 / -1;height:6px}
.dfoot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}

/* ---------- charts ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.grid3 .full{grid-column:1 / -1}
.grid3 > .card{display:flex;flex-direction:column}
.grid3 > .card > .donutrow{flex:1}
.grid3 > .card > .trows{flex:1;align-content:space-evenly}
.hbars.two{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:44px;grid-auto-flow:column}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.trk{position:relative;background:var(--track);border-radius:99px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--bc);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);min-width:3px}
.hbars{margin-top:14px;display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(84px,150px) minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13.5px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);font-weight:500}
.hbar .trk{height:9px}
.hbar .vl{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hbar:hover .fill,.rrow:hover .fill{filter:brightness(1.08)}
.cols{display:flex;align-items:flex-end;gap:8px;height:160px;margin-top:22px}
.colw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.colw .bar{width:100%;max-width:34px;background:var(--bc);border-radius:10px 10px 3px 3px;height:0;transition:height .9s cubic-bezier(.2,.8,.2,1);min-height:3px}
.colw .cv{font-size:12.5px;font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums}
.colw:hover .bar{filter:brightness(1.08)}
.collabs{display:flex;gap:8px;margin-top:8px}
.collabs div{flex:1;text-align:center;font-size:11px;color:var(--ink2);line-height:1.2;min-width:0}
.donutrow{display:flex;align-items:center;gap:18px;margin-top:12px}
.donut{flex:none;width:150px;height:150px;position:relative}
.donut svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1),stroke-width .15s}
.donut circle.seg:hover{stroke-width:19}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut .mid b{display:block;font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.donut .mid span{font-size:11.5px;color:var(--ink2)}
.dlist{flex:1;display:grid;gap:7px;min-width:0}
.dlist div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 44px;gap:8px;align-items:center;font-size:13px}
.dlist .n{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.dlist em{font-style:normal;color:var(--faint);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.stackbar{display:flex;gap:3px;height:10px;margin-top:14px;border-radius:99px;overflow:hidden}
.stackbar i{display:block;height:100%;background:var(--bc);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);min-width:3px}
.trows{display:grid;gap:11px;margin-top:14px}
.trow{display:grid;grid-template-columns:12px minmax(54px,auto) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.trow .n{font-weight:500} .trow .c{color:var(--ink2);font-size:12px;font-weight:400;margin-left:6px}
.trow .trk{height:8px}
.trow b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.trend{display:flex;align-items:flex-end;gap:10px;height:190px;margin-top:20px}
.trend .colw .bar{max-width:46px;background:linear-gradient(180deg,var(--t2),var(--t1))}
.trend .colw.gap .cv{color:var(--faint)}
.trend .colw .bar.none{background:repeating-linear-gradient(135deg,var(--track) 0 6px,#fff 6px 10px);height:14px;border:1px dashed var(--line)}
.pbody .trend{height:150px}
.tw{margin-top:9px;padding-top:8px;border-top:1px solid var(--sbd)}

function build(payload){

    var p = (payload.discoms || {})[name];
    if (!ready(p)) return;

    if (one.summary.length) parts.push(one);

    d[k] = []; parts.forEach(function(p){ d[k] = d[k].concat(p[k] || []); });
  });

    var B = {discom:STATE_NAME, from:first.from, upto:first.upto, days:first.days, total:sum('total'), n:sum('n'), ev:sum('ev'), min:sum('min'),
             over:sum('over'), many:sum('many'), divisions:sum('divisions'), v33:sum('v33'), agri:sum('agri'), ind:sum('ind'), o24:sum('o24'),
             maxDur:longest.maxDur, maxEv:Math.max.apply(null, S.map(function(r){ return num(r.maxEv); }))};

    var top = lists.reduce(function(a, r){ return Math.max(a, num(r.rank)); }, 0);
    [['Outage','min','ev'], ['Interruptions','ev','min'], ['Min per Interruption','mpi','min']].forEach(function(m){
      ['Top','Bottom'].forEach(function(side){
        var g = side === 'Top' ? -1 : 1;
        lists.filter(function(r){ return String(r.measure) === m[0] && String(r.side) === side; })
          .sort(function(a, b){
            return g * (num(a[m[1]]) - num(b[m[1]])) || g * (num(a[m[2]]) - num(b[m[2]])) ||
                   String(a.circle).localeCompare(String(b.circle)) || String(a.division).localeCompare(String(b.division)) || String(a.feeder).localeCompare(String(b.feeder));
          })
          .slice(0, top).forEach(function(r, i){ extra.push(ext(r, {listFor:STATE_NAME, rank:i + 1})); });

    var all = [];
    order.forEach(function(k){
      var rows = byDay[k];

        var add = function(f){ return rows.reduce(function(a, r){ return a + num(r[f]); }, 0); };

}

  var kids = [el('div', {class:'crole', text:role + (place ? ', ' + place : '')}),
    who && who.name ? el('div', {class:'cname', text:who.name}) : null,
    tel ? el('div', {class:'cline'}, [el('span', {class:'cnum', text:showNo(who.mobile)}), el('span', {class:'call', 'aria-hidden':'true'}, [icon('phone'), el('span', {class:'w', text:'Call'})])])
        : el('div', {class:'cnone', text:'Number not in directory'})];
  if (!tel) return el('div', {class:'cbox'}, kids);
  // Inside Google's frame a link may not take over the page; it may only open a new window. So the dialer is opened that way.
  return el('a', {class:'cbox tel', href:'tel:' + tel, 'aria-label':'Call ' + role + ', ' + place + (who.name ? ', ' + who.name : '') + ', ' + showNo(who.mobile),
                  onclick:function(){ var no = showNo(who.mobile), nm = who.name || role; setTimeout(function(){ callHelp(nm, no); }, 700); }}, kids);
}

/* ---------- highest average outage (bottom 5 circles, 10 divisions, 10 feeders) ---------- */
function bottomCircles(nm){
  return DATA.circles.filter(function(r){ return String(r.discom) === nm && yes(r.received); })
    .sort(function(a, b){ return num(b.avgMin) - num(a.avgMin) || String(a.circle).localeCompare(String(b.circle)); }).slice(0, 5);
}
function bottomDivisions(nm){
  return DATA.divisions.filter(function(r){ return String(r.discom) === nm && yes(r.received) && yes(r.big); })
    .sort(function(a, b){ return num(b.avgMin) - num(a.avgMin) || String(a.division).localeCompare(String(b.division)); }).slice(0, 10);
}
function bottomFeeders(nm){
  return DATA.ranks.filter(function(r){ return String(r.listFor) === nm && String(r.measure) === 'Outage' && String(r.side) === 'Top' && num(r.rank) <= 10; })
    .sort(function(a, b){ return num(a.rank) - num(b.rank); });
}
function discomFor(r){ return DATA.divisions.filter(function(x){ return String(x.discom) === String(r.discom) && String(x.division) === String(r.division); })[0]; }
function renderBottom($c){
  var list = scope === STATE_NAME ? discomsHere() : [scope];
  $c.appendChild(el('div', {class:'sechead'}, [el('h2', {text:'Highest Average Outage'}),
    el('span', {class:'chip s-serious'}, [el('i', {class:'dt', 'aria-hidden':'true'}), 'Highest first, with contact numbers']),
    el('button', {class:'btn go pdfgo', onclick:function(){ runPdf('bottom'); }}, [icon('doc'), 'Export PDF'])]));
  $c.appendChild(el('div', {class:'ctrl bfilter'}, [pills([{v:'all', t:'All'}, {v:'circles', t:'Circles'}, {v:'divisions', t:'Divisions'}, {v:'feeders', t:'Feeders'}], ui.bfilter,
    function(v){ ui.bfilter = v; try { window.localStorage.setItem('feeder-outage-bfilter', v); } catch (e) {} render(); }, 'Show')]));
  var showC = ui.bfilter === 'all' || ui.bfilter === 'circles', showD = ui.bfilter === 'all' || ui.bfilter === 'divisions', showF = ui.bfilter === 'all' || ui.bfilter === 'feeders';
  list.forEach(function(nm){
    var S = sumOf(nm); if (!S) return;
    var sec = el('div', {class:'sec bsec', style:'--dc:' + colourOf(nm)});
    sec.appendChild(el('div', {class:'bhead'}, [el('span', {class:'dot'}), el('h2', {text:nm}), chip(band(num(S.avgMin))),
      el('span', {class:'count', text:hhmm(S.avgMin) + ' average outage per feeder, ' + int(S.total) + ' feeders'})]));
    function row(i, main, value, boxes){
      return el('div', {class:'brow'}, [el('div', {class:'no', text:String(i + 1)}), main, value, el('div', {class:'cboxes'}, boxes)]);
    }
    function val(min, sub){ return el('div', {class:'bv'}, [el('b', {text:hhmm(min)}), chip(band(num(min))), sub ? el('span', {class:'bvs', text:sub}) : null]); }
    // circles
    var cc = el('div', {class:'card bcard'}, [el('h3', {text:'Bottom 5 circles'}), el('div', {class:'sub3', text:'Average outage per feeder (hr:min), highest first'})]);
    bottomCircles(nm).forEach(function(r, i){
      var dn = DATA.divisions.filter(function(x){ return String(x.discom) === nm && String(x.circle) === String(r.circle); }).length;
      cc.appendChild(row(i, el('div', {style:'min-width:0'}, [el('div', {class:'t1', text:String(r.circle)}),
          el('div', {class:'t2', text:dn + ' divisions, ' + int(r.total) + ' feeders; ' + dec(r.avgEv, 2) + ' interruptions per feeder; ' + int(r.over) + ' over 4 hrs'})]),
        val(r.avgMin), [contactBox('ESE Supply', String(r.circle), eseOf(nm, r.circle))]));
    });
    if (showC) sec.appendChild(cc);
    // divisions
    var dl = bottomDivisions(nm);
    var dc = el('div', {class:'card bcard'}, [el('h3', {text:'Bottom 10 divisions'}), el('div', {class:'sub3', text:'Average outage per feeder (hr:min), highest first. Divisions with fewer than 10 feeders are not ranked.'})]);
    dl.forEach(function(r, i){
      dc.appendChild(row(i, el('div', {style:'min-width:0'}, [el('button', {class:'t1 link', text:String(r.division), onclick:function(){ openDivision(r, dl); }}),
          el('div', {class:'t2', text:String(r.circle) + ' circle; ' + int(r.total) + ' feeders; ' + dec(r.avgEv, 2) + ' interruptions per feeder; ' + int(r.over) + ' over 4 hrs'})]),
        val(r.avgMin), [contactBox('EEE Supply', String(r.division), eeeOf(nm, r.circle, r.division)), contactBox('ESE Supply', String(r.circle), eseOf(nm, r.circle))]));
    });
    if (showD) sec.appendChild(dc);
    // feeders
    var fl = bottomFeeders(nm);
    var fc = el('div', {class:'card bcard'}, [el('h3', {text:'Bottom 10 feeders'}), el('div', {class:'sub3', text:'Total outage of the feeder (hr:min), highest first'})]);
    if (!fl.length) fc.appendChild(el('div', {class:'empty', text:'No feeder figures'}));
    fl.forEach(function(r, i){
      var dv = discomFor(r);
      fc.appendChild(row(i, el('div', {style:'min-width:0'}, [dv ? el('button', {class:'t1 link', text:String(r.feeder), onclick:function(){ openDivision(dv, [dv]); }}) : el('div', {class:'t1', text:String(r.feeder)}),
          el('div', {class:'t2', text:[r.ss, r.division, r.circle, r.type].filter(function(x){ return x !== '' && x !== undefined; }).join(', ')})]),
        val(r.min, int(r.ev) + ' interruptions'), [contactBox('EEE Supply', String(r.division), eeeOf(nm, r.circle, r.division)), contactBox('ESE Supply', String(r.circle), eseOf(nm, r.circle))]));
    });
    if (showF) sec.appendChild(fc);
    $c.appendChild(sec);
  });
}
(function(){
  Array.prototype.forEach.call(document.querySelectorAll('#pageNav button'), function(b){
    b.addEventListener('click', function(){
      ui.page = b.getAttribute('data-page');
      try { window.localStorage.setItem('feeder-outage-page', ui.page); } catch (e) {}
      if (DATA) render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
})();

/* 4. Highest average outage, with contact numbers */
function pdfBottom(){
  var P = newPdf('Highest Average Outage', 'Highest first, with contact numbers. ' + asOnText(), true);
  var mob = function(w){ var t = w ? showNo(w.mobile) : ''; if (!t) return cell('Not in directory', null, {dim:true}); return cell((w.name ? w.name + '\n' : '') + t, null, {contact:{name:w.name || '', num:t, tel:telOf(w.mobile)}}); };
  discomsHere().forEach(function(nm, k){
    if (k > 0){ P.doc.addPage(); P.y = 56; }
    var col = DISCOM_HEX[nm], S = sumOf(nm), d0 = P.doc;
    need(P, 70); ink(d0, col); d0.setFont('helvetica', 'bold'); d0.setFontSize(16); d0.text(nm, PM, P.y + 4);
    ink(d0, MUTED); d0.setFont('helvetica', 'normal'); d0.setFontSize(9.5);
    d0.text(hhmm(S.avgMin) + ' hr:min average outage per feeder, ' + int(S.total) + ' feeders', PM, P.y + 19); P.y += 40;
    heading(P, 'Bottom 5 circles', col);
    table(P, ['Rank', 'Circle', 'Total feeders', 'Interruptions per feeder', 'Over 4 hrs', 'Average outage (hr:min)', 'Status', 'ESE Supply'],
      bottomCircles(nm).map(function(r, i){ return [String(i + 1), cell(String(r.circle), null, {bold:true}), int(r.total), dec(r.avgEv, 2), int(r.over),
        cell(hhmm(r.avgMin), num(r.avgMin), {bold:true, colour:col}), st(r.avgMin), mob(eseOf(nm, r.circle))]; }),
      {bar:5, tight:true, cols:{0:{halign:'center', cellWidth:34}, 1:{halign:'left'}, 2:{halign:'center'}, 3:{halign:'center'}, 4:{halign:'center'}, 5:{halign:'center', cellWidth:100}, 6:{halign:'center'}, 7:{halign:'center', cellWidth:150}}});
    heading(P, 'Bottom 10 divisions (divisions with 10 or more feeders)', col);
    table(P, ['Rank', 'Division', 'Circle', 'Total feeders', 'Interruptions per feeder', 'Over 4 hrs', 'Average outage (hr:min)', 'Status', 'EEE Supply', 'ESE Supply'],
      bottomDivisions(nm).map(function(r, i){ return [String(i + 1), cell(String(r.division), null, {bold:true}), String(r.circle), int(r.total), dec(r.avgEv, 2), int(r.over),
        cell(hhmm(r.avgMin), num(r.avgMin), {bold:true, colour:col}), st(r.avgMin), mob(eeeOf(nm, r.circle, r.division)), mob(eseOf(nm, r.circle))]; }),
      {bar:6, tight:true, cols:{0:{halign:'center', cellWidth:34}, 1:{halign:'left'}, 2:{halign:'left'}, 3:{halign:'center'}, 4:{halign:'center'}, 5:{halign:'center'}, 6:{halign:'center', cellWidth:84}, 7:{halign:'center'}, 8:{halign:'center', cellWidth:120}, 9:{halign:'center', cellWidth:120}}});
    heading(P, 'Bottom 10 feeders (longest total outage)', col);
    table(P, ['Rank', 'Feeder', 'Substation', 'Division', 'Circle', 'Total outage (hr:min)', 'Interruptions', 'EEE Supply', 'ESE Supply'],
      bottomFeeders(nm).map(function(r){ return [String(num(r.rank)), cell(String(r.feeder), null, {bold:true}), String(r.ss), String(r.division), String(r.circle),
        cell(hhmm(r.min), num(r.min), {bold:true, colour:col}), int(r.ev), mob(eeeOf(nm, r.circle, r.division)), mob(eseOf(nm, r.circle))]; }),
      {bar:5, tight:true, size:8, cols:{0:{halign:'center', cellWidth:30}, 1:{halign:'left', cellWidth:118}, 2:{halign:'left', cellWidth:92}, 3:{halign:'left'}, 4:{halign:'left'}, 5:{halign:'center', cellWidth:90}, 6:{halign:'center', cellWidth:66}, 7:{halign:'center', cellWidth:112}, 8:{halign:'center', cellWidth:112}}});
  });
  finish(P, 'Highest_Average_Outage_' + fileDay() + '.pdf');
}

var MAKERS = {daily:pdfDaily, avg:pdfAverage, feeders:pdfFeeders, bottom:pdfBottom};
function runPdf(kind){
  if (!DATA){ toast('The figures are still loading. Try again in a moment.'); return; }
  toast('Making the PDF ...');
  pdfLibs().then(function(){
    try { MAKERS[kind](); }
    catch (err){ note('pdf failed', err); toast('Could not make the PDF. Please try again.'); }
  }, function(err){ note('pdf tools did not load', err); toast('Could not make the PDF: check the internet connection and try again.'); });
}
/* the PDF menu */
(function(){
  var btn = document.getElementById('pdfBtn'), menu = document.getElementById('pdfMenu');
  function close(){ menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', function(e){ e.stopPropagation(); var open = menu.hidden; menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('button').focus(); });
  document.addEventListener('click', function(e){ if (!menu.hidden && !menu.contains(e.target)) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !menu.hidden){ close(); btn.focus(); } });
  Array.prototype.forEach.call(menu.querySelectorAll('button[data-pdf]'), function(b){
    b.addEventListener('click', function(){ close(); runPdf(b.getAttribute('data-pdf')); });
  });
})();

load();
})();
