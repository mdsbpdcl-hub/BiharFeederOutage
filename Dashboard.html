<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bihar 11 kV Feeder Outage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#1d2433; --ink2:#667085; --muted:#667085; --faint:#98a2b3; --line:#e7eaf0; --track:#eef0f5; --page:#f5f6fa; --card:#ffffff;
  --shadow:0 1px 2px rgba(29,36,51,.04),0 10px 28px -14px rgba(29,36,51,.22);
  --shadow-up:0 2px 4px rgba(29,36,51,.05),0 18px 34px -14px rgba(29,36,51,.30);
  /* the two DISCOMs: fixed */
  --sb:#2a78d6; --nb:#eb6834;
  /* status: fixed. mark / text / tint / edge */
  --good:#22a35a;    --good-t:#1a8a4c;    --good-bg:#eaf8f0;    --good-bd:#bfe6cf;
  --warn:#e3a21a;    --warn-t:#9a6400;    --warn-bg:#fff7e4;    --warn-bd:#f3dca2;
  --serious:#df4b3f; --serious-t:#b8352b; --serious-bg:#fff0ee; --serious-bd:#f5c6c1;
  --crit:#9e2a22;    --crit-t:#86211b;    --crit-bg:#fbe7e5;    --crit-bd:#e7b2ad;
  --nodata:#a3abbb;  --nodata-t:#6b7385;  --nodata-bg:#f4f5f8;  --nodata-bd:#e3e6ed;
  /* measures: fixed */
  --m-ev:#5b6ee1;  --m-ev-bg:#eef0fd;
  --m-fd:#0f9f8f;  --m-fd-bg:#e5f6f3;
  --m-ov:#c8438f;  --m-ov-bg:#fbedf5;
  --m-mpi:#a25ad9; --m-mpi-bg:#f6eefc;
  /* feeder types: fixed */
  --ft1:#0f9f8f; --ft2:#5b6ee1; --ft3:#a25ad9; --ft4:#c8438f;
  /* theme (Sunrise until the page sets the chosen one) */
  --t1:#f0752f; --t2:#f7a531; --t1a:rgba(240,117,47,.16); --t2a:rgba(247,165,49,.14); --t1s:rgba(240,117,47,.09);
  --r1:#f9c3a2; --r2:#f6a679; --r3:#f38a51; --r4:#f0752f; --r5:#c86330; --r6:#a15231; --r7:#7a4132;
  --q1:#fbd6a0; --q2:#f9be6a; --q3:#f7a531; --q4:#cb8a32; --q5:#9f6f33;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{color:var(--ink);font:15px/1.45 "Outfit","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh;
  background:
    radial-gradient(900px 560px at 0% -8%, var(--t1a), transparent 62%),
    radial-gradient(820px 520px at 100% 0%, var(--t2a), transparent 60%),
    radial-gradient(1000px 640px at 55% 112%, var(--t1s), transparent 62%),
    var(--page);
  background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-left:24px;padding-right:24px}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid rgba(231,234,240,.8)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:11px;padding-bottom:11px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.bolt{flex:none;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--t1),var(--t2));display:grid;place-items:center;box-shadow:0 8px 18px -4px var(--t1a)}
.bolt svg{width:22px;height:22px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
.datepill{margin-top:2px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg{display:inline-flex;background:var(--track);border-radius:999px;padding:4px;gap:2px}
.seg:empty{display:none}
.seg button{border:0;background:transparent;color:var(--ink2);padding:7px 16px;border-radius:999px;font-weight:600;cursor:pointer;min-height:36px;transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(29,36,51,.08),0 4px 10px -4px rgba(29,36,51,.18)}
.swatches{display:inline-flex;gap:8px;align-items:center;padding:0 2px}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:transform .2s,box-shadow .2s}
.swatches button:hover{transform:scale(1.08)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.refresh{border:0;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;cursor:pointer;color:#fff;font-weight:600;
  background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 8px 16px -8px var(--t1)}
.refresh svg{width:17px;height:17px;transition:transform .6s}
.refresh.spin svg{transform:rotate(360deg)}
.refresh:hover{filter:brightness(1.05)}
.pdfwrap{position:relative}
.pdfbtn{border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.pdfbtn:hover{background:#f6f7fb}
.pdfbtn svg{width:17px;height:17px;color:var(--t1)}
.pdfbtn svg.chev{width:13px;height:13px;color:var(--ink2)}
.pdfmenu{position:absolute;right:0;top:46px;z-index:40;width:310px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 4px rgba(29,36,51,.06),0 18px 40px -16px rgba(29,36,51,.35);padding:6px}
.pdfmenu button{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer}
.pdfmenu button:hover,.pdfmenu button:focus-visible{background:#f6f7fb}
.pdfmenu .pi{flex:none;width:34px;height:34px;border-radius:10px;background:var(--t1a);color:var(--t1);display:grid;place-items:center}
.pdfmenu .pi svg{width:18px;height:18px}
.pdfmenu b{display:block;font-size:14px;font-weight:600}
.pdfmenu .s{display:block;font-size:12px;color:var(--ink2);line-height:1.3;margin-top:1px}
.pages{display:inline-flex;flex-wrap:wrap;gap:4px;margin-bottom:18px;background:var(--track);border-radius:14px;padding:4px;max-width:100%}
.pages[hidden]{display:none}
.pages button{border:0;background:transparent;padding:9px 20px;border-radius:11px;font-weight:600;color:var(--ink2);cursor:pointer;min-height:40px;font-size:15px}
.pages button:hover{color:var(--ink)}
.pages button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(29,36,51,.08),0 4px 10px -4px rgba(29,36,51,.18)}
.pdfgo{margin-left:auto;display:inline-flex;align-items:center;gap:7px}
.pdfgo svg{width:16px;height:16px}
.bsec{margin-top:22px}
.bhead{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:4px}
.bhead .dot{width:12px;height:12px;background:var(--dc)}
.bhead h2{font-size:21px;font-weight:700;letter-spacing:-.3px}
.bcard{margin-top:12px;border-left:5px solid var(--dc)}
.brow{display:grid;grid-template-columns:32px minmax(0,1.15fr) 150px minmax(0,1.6fr);gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.bcard .brow:nth-child(3){margin-top:6px}
.brow .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--serious-bg);color:var(--serious-t)}
.brow .t1{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.brow .t1.link{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.brow .t1.link:hover{text-decoration-color:var(--t1)}
.brow .t2{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.35}
.bv{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.bv b{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.bv .chip{padding:2px 9px;font-size:11.5px}
.bvs{font-size:12px;color:var(--ink2)}
.cboxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;min-width:0;max-width:640px}
.cbox{background:#f7f8fb;border:1px solid var(--line);border-radius:12px;padding:7px 10px;min-width:0;display:block;color:inherit;text-decoration:none}
a.cbox{cursor:pointer;transition:border-color .15s,background .15s}
a.cbox:hover{border-color:var(--t1);background:#fff}
.crole{font-size:11.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.cnum{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.call{display:inline-flex;align-items:center;gap:5px;color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;text-decoration:none;white-space:nowrap;min-height:30px}
.call svg{width:14px;height:14px}
.call:hover{filter:brightness(1.05)}
.cnone{font-size:12.5px;color:var(--faint);margin-top:4px}
.cname{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.25;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);z-index:95;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 2px 4px rgba(29,36,51,.06),0 18px 40px -16px rgba(29,36,51,.35);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));border-radius:999px;padding:5px 13px;font-weight:600;text-decoration:none;white-space:nowrap}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--t1);outline-offset:2px}

main.wrap{padding-top:22px;padding-bottom:48px}
.sec{margin-top:28px}
.sechead{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.sechead h2{font-size:19px;font-weight:700;letter-spacing:-.2px}
.count{font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.card{background:var(--card);border:1px solid rgba(231,234,240,.7);border-radius:18px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{font-size:15px;font-weight:600;color:var(--ink)}
.card .sub3{font-size:12.5px;color:var(--ink2);margin-top:1px}

/* ---------- dial + KPI tiles ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);gap:16px}
.dialcard{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px 18px}
.dialbox{position:relative;width:100%;max-width:380px}
.dialbox svg{display:block;width:100%;height:auto;overflow:visible}
.needle{transition:transform 1.3s cubic-bezier(.3,1.25,.4,1)}
.arcv{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.dialval{text-align:center;margin-top:6px}
.dialval .v{font-size:58px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.dialval .u{font-size:13px;font-weight:500;color:var(--ink2);margin-left:6px;letter-spacing:0}
.dialval .l{font-size:14px;font-weight:500;color:var(--ink2);margin-top:6px}
.chiprow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpi{border-radius:18px;padding:16px 16px 12px;display:flex;flex-direction:column;min-height:150px;min-width:0;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#fff 35%,var(--kt));border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
.kpi .kh{display:flex;align-items:center;gap:10px}
.kpi .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--kc);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -6px var(--kc)}
.kpi .ico svg{width:21px;height:21px}
.kpi .lab{font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.25}
.kpi .val{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--ink2)}
.kpi .move{align-self:flex-start;margin-top:7px;font-size:12px;font-weight:600;color:var(--kc);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.spark{flex:1 1 40px;min-height:34px;margin:8px -16px -12px;position:relative}
.spark svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.k-ev{--kc:var(--m-ev);--kt:var(--m-ev-bg)}
.k-fd{--kc:var(--m-fd);--kt:var(--m-fd-bg)}
.k-ov{--kc:var(--m-ov);--kt:var(--m-ov-bg)}
.k-mpi{--kc:var(--m-mpi);--kt:var(--m-mpi-bg)}

/* ---------- small fact tiles ---------- */
.facts6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:16px}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid rgba(231,234,240,.7);display:flex;gap:11px;align-items:flex-start;min-width:0}
.stat .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--t1a);color:var(--t1);display:grid;place-items:center}
.stat .ic svg{width:18px;height:18px}
.stat .l{font-size:12.5px;font-weight:500;color:var(--ink2);line-height:1.25}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--ink2)}

/* ---------- DISCOM cards ---------- */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.dcard{display:flex;flex-direction:column;text-align:left;width:100%;cursor:pointer;position:relative;overflow:hidden;padding:16px 18px 14px 25px;transition:transform .2s,box-shadow .2s}
.dcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--dc)}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-up)}
.dtop{display:flex;align-items:center;gap:16px}
.dcard .mini{flex:none;width:124px}
.dcard .mini svg{display:block;width:100%;height:auto;overflow:visible}
.dcard .mv{text-align:center;font-size:21px;font-weight:700;margin-top:-2px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.dname{font-size:16px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dc);display:inline-block;flex:none}
.mbars{flex:1;min-width:0;display:grid;gap:8px}
.mbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12.5px;color:var(--ink2);align-items:end}
.mbar b{color:var(--ink);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.mbar .trk{grid-column:1 / -1;height:6px}
.dfoot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}

/* ---------- charts ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.grid3 .full{grid-column:1 / -1}
.grid3 > .card{display:flex;flex-direction:column}
.grid3 > .card > .donutrow{flex:1}
.grid3 > .card > .trows{flex:1;align-content:space-evenly}
.hbars.two{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:44px;grid-auto-flow:column}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.trk{position:relative;background:var(--track);border-radius:99px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--bc);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);min-width:3px}
.hbars{margin-top:14px;display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(84px,150px) minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13.5px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);font-weight:500}
.hbar .trk{height:9px}
.hbar .vl{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hbar:hover .fill,.rrow:hover .fill{filter:brightness(1.08)}
.cols{display:flex;align-items:flex-end;gap:8px;height:160px;margin-top:22px}
.colw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.colw .bar{width:100%;max-width:34px;background:var(--bc);border-radius:10px 10px 3px 3px;height:0;transition:height .9s cubic-bezier(.2,.8,.2,1);min-height:3px}
.colw .cv{font-size:12.5px;font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums}
.colw:hover .bar{filter:brightness(1.08)}
.collabs{display:flex;gap:8px;margin-top:8px}
.collabs div{flex:1;text-align:center;font-size:11px;color:var(--ink2);line-height:1.2;min-width:0}
.donutrow{display:flex;align-items:center;gap:18px;margin-top:12px}
.donut{flex:none;width:150px;height:150px;position:relative}
.donut svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1),stroke-width .15s}
.donut circle.seg:hover{stroke-width:19}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut .mid b{display:block;font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.donut .mid span{font-size:11.5px;color:var(--ink2)}
.dlist{flex:1;display:grid;gap:7px;min-width:0}
.dlist div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 44px;gap:8px;align-items:center;font-size:13px}
.dlist .n{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.dlist em{font-style:normal;color:var(--faint);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.stackbar{display:flex;gap:3px;height:10px;margin-top:14px;border-radius:99px;overflow:hidden}
.stackbar i{display:block;height:100%;background:var(--bc);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);min-width:3px}
.trows{display:grid;gap:11px;margin-top:14px}
.trow{display:grid;grid-template-columns:12px minmax(54px,auto) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.trow .n{font-weight:500} .trow .c{color:var(--ink2);font-size:12px;font-weight:400;margin-left:6px}
.trow .trk{height:8px}
.trow b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.trend{display:flex;align-items:flex-end;gap:10px;height:190px;margin-top:20px}
.trend .colw .bar{max-width:46px;background:linear-gradient(180deg,var(--t2),var(--t1))}
.trend .colw.gap .cv{color:var(--faint)}
.trend .colw .bar.none{background:repeating-linear-gradient(135deg,var(--track) 0 6px,#fff 6px 10px);height:14px;border:1px dashed var(--line)}
.pbody .trend{height:150px}
.tw{margin-top:9px;padding-top:8px;border-top:1px solid var(--sbd)}
.twl{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.twl b{font-weight:600;color:var(--ink2)} .twl b.up{color:var(--serious-t)} .twl b.down{color:var(--good-t)}
.twsp{height:26px;margin-top:4px}
.twsp svg{display:block;width:100%;height:100%}

/* ---------- controls ---------- */
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.ctrl select,.ctrl input{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:40px;min-width:0;box-shadow:var(--shadow)}
.ctrl input{width:190px}
.pills{display:inline-flex;flex-wrap:wrap;background:var(--track);border-radius:12px;padding:3px;gap:2px}
.pills button{border:0;background:transparent;padding:6px 13px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink2);min-height:32px;transition:background .2s,color .2s,box-shadow .2s}
.pills button:hover{color:var(--ink)}
.pills button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(29,36,51,.08),0 4px 10px -4px rgba(29,36,51,.18)}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.iconkey{margin-left:auto;display:inline-flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2)}
.iconkey span{display:inline-flex;align-items:center;gap:5px}
.iconkey svg{width:14px;height:14px;color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--st,var(--ink));background:var(--sbg,#fff);border:1px solid var(--sbd,var(--line));white-space:nowrap}
.chip .dt{width:8px;height:8px;border-radius:50%;background:var(--sc,var(--faint));flex:none}
.chip small{font-size:12px;font-weight:500;color:var(--ink2)}
button.chip{cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .2s;min-height:34px;padding:5px 12px}
button.chip:hover{transform:translateY(-1px)}
button.chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sc,var(--ink))}
.keys.filtering button.chip[aria-pressed="false"]{opacity:.5}
.chip em{font-style:normal;font-weight:700;background:#fff;border-radius:999px;padding:0 7px;font-size:12px;color:var(--ink)}
.dchip{--sbg:#fff;--st:var(--ink);--sc:var(--dc)}

/* ---------- division tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{border:1px solid var(--sbd);border-radius:18px;padding:13px 14px 13px;text-align:left;cursor:pointer;position:relative;display:flex;flex-direction:column;width:100%;min-width:0;
  background:linear-gradient(165deg,#fff 38%,var(--sbg));box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}
.tile .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tile .who{display:flex;gap:9px;min-width:0;align-items:flex-start}
.tile .rkb{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:99px;background:#fff;border:1px solid var(--sbd);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--st);font-variant-numeric:tabular-nums}
.tile .nm{font-weight:700;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.tile .ci{color:var(--ink2);font-size:12px;margin-top:2px}
.tile .ring{flex:none;width:46px;height:46px;position:relative}
.tile .ring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:700;color:var(--st)}
.tile .big{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
.tile .big.none{font-size:19px;letter-spacing:0;color:var(--ink2);margin-top:14px}
.tile .tl{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tile .tl .chip{padding:2px 9px;font-size:11.5px}
.tile .thin{height:5px;margin-top:10px}
.tile .facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.tile .facts span{display:inline-flex;align-items:center;gap:5px}
.tile .facts svg{width:14px;height:14px;color:var(--faint)}
.tile .facts b{color:var(--ink);font-weight:700}
.ringc{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.empty{color:var(--ink2);padding:26px;text-align:center}
.s-good{--sc:var(--good);--st:var(--good-t);--sbg:var(--good-bg);--sbd:var(--good-bd)}
.s-warn{--sc:var(--warn);--st:var(--warn-t);--sbg:var(--warn-bg);--sbd:var(--warn-bd)}
.s-serious{--sc:var(--serious);--st:var(--serious-t);--sbg:var(--serious-bg);--sbd:var(--serious-bd)}
.s-crit{--sc:var(--crit);--st:var(--crit-t);--sbg:var(--crit-bg);--sbd:var(--crit-bd)}
.s-nodata,.tile.off{--sc:var(--nodata);--st:var(--nodata-t);--sbg:var(--nodata-bg);--sbd:var(--nodata-bd)}

/* ---------- rankings + feeder lists ---------- */
.rlist{display:grid;gap:2px}
.rrow{display:grid;grid-template-columns:32px minmax(0,300px) minmax(60px,1fr) 70px;gap:12px;align-items:center;padding:8px;border-radius:12px}
.rowbtn{border:0;background:transparent;text-align:left;width:100%;cursor:pointer}
.rrow:hover{background:#f6f7fb}
.rrow .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--sbg);color:var(--st)}
.rlist.worst .rrow{--sbg:var(--serious-bg);--st:var(--serious-t)}
.rlist.best .rrow{--sbg:var(--good-bg);--st:var(--good-t)}
.rrow .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .t2{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .trk{height:5px}
.rrow .vl{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto 58px;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .t1{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.frow .t2{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.frow .trk{height:5px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--m-ev-bg);color:#3f4fb8;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge svg{width:12px;height:12px}
.frow .o{text-align:right;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:40px;color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{background:#f6f7fb}
.btn.go{border:0;color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2))}
.more{margin-top:10px;text-align:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;margin-top:14px;align-items:start}
.agwrap{border-radius:18px;padding:18px;background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,.45));border:1px solid rgba(231,234,240,.8)}

/* ---------- detail panel ---------- */
.veil{position:fixed;inset:0;background:rgba(29,36,51,.28);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--page);z-index:60;transform:translateX(104%);transition:transform .36s cubic-bezier(.2,.85,.2,1);display:flex;flex-direction:column;box-shadow:-24px 0 60px -20px rgba(29,36,51,.4);border-radius:20px 0 0 20px;overflow:hidden}
.panel.on{transform:none}
.phead{position:sticky;top:0;z-index:2;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.phead .ttl{flex:1 1 200px;min-width:0}
.phead h2{font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.3px;overflow-wrap:anywhere}
.phead p{color:var(--ink2);font-size:13px;margin-top:1px}
.phead .chiprow{justify-content:flex-start;margin-top:6px}
.phead .nav{display:flex;gap:6px;flex:none}
.iconbtn{border:1px solid var(--line);background:#fff;color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.iconbtn:hover{background:#f6f7fb}
.iconbtn[disabled]{opacity:.4;cursor:default}
.iconbtn svg{width:17px;height:17px}
.pbody{overflow:auto;padding:14px 16px 30px;-webkit-overflow-scrolling:touch;flex:1}
.pdial{display:flex;align-items:center;gap:16px}
.pdial .mini{flex:none;width:150px}
.pdial .mini svg{display:block;width:100%;height:auto;overflow:visible}
.pdial .pv{font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums}
.pdial .pl{font-size:13px;color:var(--ink2);margin-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.pk{background:#fff;border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);border:1px solid rgba(231,234,240,.7)}
.pk .v{font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.pk .l{font-size:12px;color:var(--ink2);margin-top:1px;line-height:1.25}
.pbody .card{margin-top:12px;padding:16px}
.cardhead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.tbox{overflow:auto;max-height:340px;margin-top:12px;border:1px solid var(--line);border-radius:12px}
table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st th{position:sticky;top:0;background:#f7f8fb;text-align:right;font-weight:600;color:var(--ink2);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st th button{border:0;background:transparent;width:100%;text-align:inherit;padding:8px 10px;cursor:pointer;font-weight:600;color:inherit}
table.st th[aria-sort="ascending"] button,table.st th[aria-sort="descending"] button{color:var(--ink)}
table.st td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.st tr:last-child td{border-bottom:0}

.tip{position:fixed;z-index:90;background:#fff;color:var(--ink);border-radius:12px;padding:8px 12px;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:260px;
  box-shadow:0 2px 4px rgba(29,36,51,.06),0 14px 30px -10px rgba(29,36,51,.32);border:1px solid var(--line)}
.tip b{font-weight:700;display:block;font-size:15px}
.tip span{color:var(--ink2)}
.tip.on{opacity:1}

/* ---------- waiting and error ---------- */
.state{min-height:58vh;display:grid;place-items:center;padding:30px 0}
.statecard{background:#fff;border-radius:18px;box-shadow:var(--shadow);border:1px solid rgba(231,234,240,.7);padding:30px 34px;text-align:center;min-width:min(320px,100%)}
.statecard h2{font-size:19px;margin:14px 0 4px}
.statecard p{color:var(--ink2);font-size:13.5px;margin-bottom:14px}
.spinner{width:44px;height:44px;margin:0 auto;border-radius:50%;border:4px solid var(--track);border-top-color:var(--t1);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stateico{width:52px;height:52px;margin:0 auto;border-radius:15px;background:var(--t1a);color:var(--t1);display:grid;place-items:center}
.stateico svg{width:26px;height:26px}
.fade{opacity:.5;transition:opacity .2s}
.intro > *{animation:rise .55s both}
.intro > *:nth-child(2){animation-delay:.08s}.intro > *:nth-child(n+3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Supply by Area ---------- */
.afilters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end;margin-bottom:12px}
.afilters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
.afilters select{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 32px 8px 12px;min-height:42px;width:100%;min-width:0;
  box-shadow:var(--shadow);color:var(--ink);font-weight:500;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.afilters select:disabled{background-color:#f6f7fa;color:var(--faint);box-shadow:none}
.afilters select:focus-visible{outline:2px solid var(--t1);outline-offset:1px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13.5px;color:var(--ink2);margin:2px 0 14px}
.crumbs button{border:0;background:transparent;padding:3px 6px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500}
.crumbs button:hover{background:#fff;color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:700;padding:3px 6px}
.crumbs .sep{color:var(--faint)}
.supval .v{font-size:58px}
.abands{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px;margin-top:14px;background:var(--track)}
.abands i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.alegend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.alegend div{min-width:0;border-left:4px solid var(--bc);padding-left:9px}
.alegend .n{font-size:12px;color:var(--ink2);line-height:1.25}
.alegend b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.alegend em{font-style:normal;font-size:12px;color:var(--faint)}
.alist{display:grid;gap:2px;margin-top:6px}
.arow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(90px,1fr) 76px 92px 86px;gap:12px;align-items:center;padding:9px 8px;border-radius:12px;
  border:0;background:transparent;text-align:left;width:100%;font:inherit;color:inherit}
button.arow{cursor:pointer}
button.arow:hover{background:#f6f7fb}
.arow.head{font-size:12px;font-weight:600;color:var(--ink2);padding-top:2px;padding-bottom:2px}
.arow.head button{border:0;background:transparent;padding:4px 0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.arow.head button[aria-pressed="true"]{color:var(--ink)}
.arow.head .r,.arow .r{text-align:right}
.arow .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .t2{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .trk{height:6px}
.arow .sv{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
.arow .sv small{font-size:11.5px;font-weight:500;color:var(--ink2);margin-left:2px}
.arow .m{font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.arow .m.low{color:var(--serious-t);font-weight:600}
.aside2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.agcard{background:linear-gradient(160deg,#fff 40%,#f2f8ec);border:1px dashed #cfe3c0}
.agcard .tag{display:inline-block;font-size:11.5px;font-weight:600;color:#557a2c;background:#eef6e6;border-radius:999px;padding:2px 9px;margin-left:6px}
.agrows{display:grid;gap:6px;margin-top:10px}
.agrows div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:13px}
.agrows span{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agrows b{font-weight:600;font-variant-numeric:tabular-nums}
.fcard .fname{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.2;overflow-wrap:anywhere}
.fcard .fplace{font-size:13.5px;color:var(--ink2);margin-top:4px}
.areawait{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 16px;color:var(--ink2)}
.areawait{text-align:left;max-width:640px;margin:0 auto}
.areawait svg{flex:none;width:22px;height:22px;color:var(--warn-t)}
.areawait .sp{width:20px;height:20px;border:2.5px solid var(--t1a);border-top-color:var(--t1);border-radius:50%;animation:aspin .8s linear infinite}
@keyframes aspin{to{transform:rotate(360deg)}}
@media (max-width:1080px){
  .afilters{grid-template-columns:repeat(2,minmax(0,1fr))}

}

   Only colours, borders, type and depth are set here; layout stays above.
   ===================================================================== */

.top{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid var(--line)}

.seg{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:2px}

.seg button[aria-pressed="true"]{background:var(--t1);color:#fff;box-shadow:none}
.refresh{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:var(--rad);box-shadow:none;height:36px}

.pdfbtn{border-radius:var(--rad);box-shadow:none;height:36px}

.pdfmenu .pi{border-radius:var(--rad-s);background:#e8f1f6}
/* page tabs: underline */
.pages{background:transparent;border-radius:0;padding:0;gap:0;border-bottom:1px solid var(--line);width:100%;margin-bottom:20px}
.pages button{border-radius:0;padding:10px 18px;min-height:44px;font-weight:500;font-size:14.5px;border-bottom:3px solid transparent;margin-bottom:-1px}

.stateico{border-radius:var(--rad);background:#e8f1f6}

/* Supply by Area: district map, Top 5 / Bottom 5, district panel */
.amapwrap{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}

.amap{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(6,auto);gap:5px;margin-top:12px}

  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;text-align:center;line-height:1.1;min-width:0;overflow:hidden;font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}

function nameKey(x){ return String(x).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
var CK = {}, DK = {};
function setContacts(fromSheet){                 // fromSheet: {DISCOM: [[circle, division, post, name, mobile], ...] or null}
  CK = {}; DK = {};
  var own = {};
  Object.keys(fromSheet || {}).forEach(function(dn){
    var list = fromSheet[dn];
    if (!list || !list.length) return;
    own[dn] = true;
    list.forEach(function(x){
      var post = nameKey(x[2]), who = {name:x[3], mobile:x[4]};
      if (post.indexOf('ESE') === 0 && !CK[dn + '|' + nameKey(x[0])]) CK[dn + '|' + nameKey(x[0])] = who;
      if (post.indexOf('EEE') === 0 && x[1] && !DK[dn + '|' + nameKey(x[1])]) DK[dn + '|' + nameKey(x[1])] = who;
    });
  });
  CONTACTS.circles.forEach(function(c){ if (!own[c[0]]) CK[c[0] + '|' + nameKey(c[1])] = {name:c[2], mobile:c[3]}; });
  CONTACTS.divisions.forEach(function(c){ if (!own[c[0]]) DK[c[0] + '|' + nameKey(c[2])] = {name:c[3], mobile:c[4]}; });
}
setContacts(null);
function eseOf(discom, circle){ return CK[String(discom) + '|' + nameKey(circle)] || null; }
function eeeOf(discom, circle, division){ return DK[String(discom) + '|' + nameKey(division)] || null; }
function telOf(n){ var x = String(n || '').replace(/[^0-9]/g, ''); if (x.length === 12 && x.slice(0, 2) === '91') x = x.slice(2); if (x.length === 11 && x.charAt(0) === '0') x = x.slice(1); return x.length === 10 ? '+91' + x : ''; }
function showNo(n){ var t = telOf(n); return t ? t.slice(3, 8) + ' ' + t.slice(8) : ''; }
function copyText(t){

  return Promise.resolve(copyOld(t));

        cell(hhmm(r.min), num(r.min), {bold:true, colour:col}), int(r.ev), mob(eeeOf(nm, r.circle, r.division)), mob(eseOf(nm, r.circle))]; }),
      {bar:5, tight:true, size:8, cols:{0:{halign:'center', cellWidth:30}, 1:{halign:'left', cellWidth:118}, 2:{halign:'left', cellWidth:92}, 3:{halign:'left'}, 4:{halign:'left'}, 5:{halign:'center', cellWidth:90}, 6:{halign:'center', cellWidth:66}, 7:{halign:'center', cellWidth:112}, 8:{halign:'center', cellWidth:112}}});
  });
  finish(P, 'Highest_Average_Outage_' + fileDay() + '.pdf');
}


/* ---------- Supply by Area PDF reports (Times New Roman) ---------- */
function areaPdfChoices(A, isEst, estName){
  if (A.block && isEst) return [{mode:'summary', t:'PDF: ' + estName + ' (estimate)'}];
  if (A.block) return [{mode:'summary', t:'PDF: Feeders of ' + (A.block === NOT_TAGGED ? 'Block not tagged' : A.block)}];
  if (A.district) return [{mode:'summary', t:'PDF: Blocks of ' + A.district}, {mode:'detail', t:'PDF: Blocks and feeders of ' + A.district}];
  return [{mode:'summary', t:'PDF: All districts'}, {mode:'detail', t:'PDF: All districts and blocks'}];
}
function areaList(){ var discom = scope === STATE_NAME ? '' : scope; return AREA.feeders.filter(function(f){ return !discom || f.discom === discom; }); }
function areaGroups(list, key){
  var by = {};
  list.forEach(function(f){ var k = f[key]; (by[k] = by[k] || []).push(f); });
  return Object.keys(by).map(function(k){ return {name:k, list:by[k], s:areaSum(by[k]), dcs:uniq(by[k], function(f){ return f.discom; })}; });
}
function areaSort(g){
  var A = ui.area, sorts = {low:function(a, b){ return a.s.supply - b.s.supply; }, ev:function(a, b){ return b.s.avgEv - a.s.avgEv; },
    size:function(a, b){ return b.s.w - a.s.w; }, name:function(a, b){ return a.name.localeCompare(b.name); }};
  return g.sort(sorts[A.sort] || sorts.low);
}
function estBlocksOf(district){
  var known = knownBlocks();
  return blocksOfDistrict(district).filter(function(b){ return !known[district + '|' + b] && !known['*|' + b]; }).sort();
}
var AREA_HEAD = ['No.', '', 'DISCOM', 'Feeders', 'With outage', 'Interruptions per feeder', 'Average outage (hr:min)', 'Average supply (hr:min)', 'Under 20 hrs (feeders)', 'Status'];
var AREA_COLS = {0:{halign:'center', cellWidth:26}, 1:{halign:'left'}, 2:{halign:'center', cellWidth:52}, 3:{halign:'center', cellWidth:44}, 4:{halign:'center', cellWidth:44},
                 5:{halign:'center', cellWidth:64}, 6:{halign:'center', cellWidth:54}, 7:{halign:'center', cellWidth:56}, 8:{halign:'center', cellWidth:48}, 9:{halign:'center', cellWidth:52}};
function areaRow(i, g){
  var s = g.s;
  return [String(i), cell(g.name, null, {bold:true}), g.dcs.length > 1 ? 'Both' : g.dcs.join(''), int(s.w), int(s.n), dec(s.avgEv, 2), hhmm(s.avgMin),
          cell(hrs(s.supply), s.supply, {bold:true}), int(s.over4), st(s.avgMin)];
}
function areaTotal(name, s, dcs){
  return [cell('', null, {total:true}), cell(name, null, {bold:true, total:true}), dcs.length > 1 ? 'Both' : dcs.join(''), cell(int(s.w), null, {bold:true}), cell(int(s.n), null, {bold:true}), cell(dec(s.avgEv, 2), null, {bold:true}),
          cell(hhmm(s.avgMin), null, {bold:true}), cell(hrs(s.supply), null, {bold:true}), cell(int(s.over4), null, {bold:true}), st(s.avgMin)];
}
function estRows(district, from){
  return estBlocksOf(district).map(function(b, k){
    var e = estimateOf(district, b); if (!e.s) return null;
    return [String(from + k), cell(b + ' (estimate)', null, {dim:true}), '-', '-', '-', cell(dec(e.s.avgEv, 2), null, {dim:true}), cell(hhmm(e.s.avgMin), null, {dim:true}),
            cell(hrs(e.s.supply), null, {dim:true, bold:true}), '-', cell('Estimate', null, {dim:true})];
  }).filter(Boolean);
}
function areaFeederRows(list){
  var fs = list.filter(function(f){ return !f.orphan; }).map(function(f){ return {f:f, s:areaSum([f])}; });
  fs.sort(ui.area.sort === 'name' ? function(a, b){ return a.f.name.localeCompare(b.f.name); } : ui.area.sort === 'ev' ? function(a, b){ return b.f.ev - a.f.ev; } : function(a, b){ return a.s.supply - b.s.supply; });
  return fs.map(function(x, i){ var f = x.f;
    return [String(i + 1), cell(f.name, null, {bold:true}), f.ss, f.type || '-', f.discom, dec(f.ev, f.ev % 1 ? 1 : 0), hhmm(f.min), cell(hrs(x.s.supply), x.s.supply, {bold:true}), st(f.min)]; });
}
var FEEDER_HEAD = ['No.', 'Feeder', 'Substation', 'Type', 'DISCOM', 'Interruptions', 'Outage (hr:min)', 'Supply (hr:min)', 'Status'];
var FEEDER_COLS = {0:{halign:'center', cellWidth:26}, 1:{halign:'left'}, 2:{halign:'left', cellWidth:92}, 3:{halign:'center', cellWidth:46}, 4:{halign:'center', cellWidth:50},
                   5:{halign:'center', cellWidth:64}, 6:{halign:'center', cellWidth:52}, 7:{halign:'center', cellWidth:52}, 8:{halign:'center', cellWidth:52}};
function areaFigures(P, s, perDay){
  // six light tiles: label above, figure below
  var d = P.doc, b = band(s.avgMin), sc = STATUS_COL[b.name] || STATUS_COL['No data'];
  var tiles = [['Average supply' + perDay, hrs(s.supply) + ' hr:min', sc], ['Average outage' + perDay, hhmm(s.avgMin) + ' hr:min', null], ['Feeders', int(s.w), null],
               ['With outage', int(s.n) + '  (' + dec(s.pct, 1) + '%)', null], ['Interruptions per feeder', dec(s.avgEv, 2), null], ['Under 20 hrs (feeders)', int(s.over4), null]];
  var gap = 8, n = tiles.length, w = (PW - 2 * PM - gap * (n - 1)) / n, h = 44, y = P.y - 8;
  tiles.forEach(function(t, i){
    var x = PM + i * (w + gap);
    fill(d, '#ffffff'); stroke(d, RV.grey); d.setLineWidth(1); d.rect(x, y, w, h, 'FD');
    fill(d, RV.tops[i % RV.tops.length]); d.rect(x, y, w, 3.5, 'F');
    ink(d, '#475467'); d.setFont(PDF_FONT, 'normal'); d.text(fit(d, t[0], w - 12, 7.5, 5.5), x + 6, y + 15);
    ink(d, t[2] ? t[2][0] : INK); d.setFont(PDF_FONT, 'bold'); d.text(fit(d, String(t[1]), w - 12, 11, 6.5), x + 6, y + 33);
  });
  P.y = y + h + 18;
}
function pdfArea(mode){
  var A = ui.area, discom = scope === STATE_NAME ? '' : scope, all = areaList();
  var info = Object.keys(AREA.info).filter(function(d){ return !discom || d === discom; }).map(function(d){ return AREA.info[d]; });
  var upto = info.map(function(x){ return x.upto; }).filter(Boolean), multi = info.some(function(x){ return x.days > 1; }), perDay = multi ? ' a day' : '';
  var asOn = upto.length ? 'Feeder figures as on ' + niceDate(upto[0]) + (upto.length > 1 && upto[1] !== upto[0] ? ' / ' + niceDate(upto[1]) : '') : '';
  var where = [discom || 'Bihar'];
  var isEst = A.block.indexOf(EST) === 0, estName = isEst ? A.block.slice(EST.length) : '';
  if (A.district) where.push(A.district);
  if (A.block) where.push(isEst ? estName + ' (estimate)' : A.block);
  var title = A.block ? (isEst ? estName + ' block (estimate)' : 'Feeders of ' + A.block) : A.district ? 'Blocks of ' + A.district : 'Supply by Area: all districts';
  var P = newPdf(title, where.join(' > ') + (asOn ? '   |   ' + asOn : ''));
  var inD = A.district ? all.filter(function(f){ return f.district === A.district; }) : all;
  if (A.block && isEst){
    var e = estimateOf(A.district, estName);
    if (!e.s) { para(P, 'No feeder of this block or of the blocks around it is in the figures.'); }
    else {
      areaFigures(P, e.s, perDay);
      para(P, 'No feeder of ' + estName + ' block is in the figures. The supply shown is the average of the feeders of the blocks around it; it is not added to any total.');
      heading(P, 'Blocks around ' + estName);
      var gs = e.parts.map(function(p){ return {name:p.block + ' (' + p.district + ')', list:p.list, s:areaSum(p.list), dcs:uniq(p.list, function(f){ return f.discom; })}; });
      var h = AREA_HEAD.slice(); h[1] = 'Block';
      table(P, h, [areaTotal('All blocks around', e.s, uniq([].concat.apply([], gs.map(function(g){ return g.list; })), function(f){ return f.discom; }))].concat(areaSort(gs).map(function(g, i){ return areaRow(i + 1, g); })), {cols:AREA_COLS, size:8.4, tight:true, flow:true, pad:2.4});
    }
  } else if (A.block){
    var inB = inD.filter(function(f){ return f.block === A.block; });
    areaFigures(P, areaSum(inB), perDay);
    table(P, FEEDER_HEAD, areaFeederRows(inB), {cols:FEEDER_COLS, size:8.4, tight:true, flow:true});
  } else if (A.district){
    var S = areaSum(inD); areaFigures(P, S, perDay);
    var blocks = areaSort(areaGroups(inD, 'block')), h2 = AREA_HEAD.slice(); h2[1] = 'Block';
    var rows = blocks.map(function(g, i){ return areaRow(i + 1, g); });
    table(P, h2, [areaTotal(A.district + ' (all blocks)', S, uniq(inD, function(f){ return f.discom; }))].concat(rows, estRows(A.district, rows.length + 1)), {cols:AREA_COLS, size:8.4, tight:true, flow:true, pad:2.4});
    if (mode === 'detail') blocks.forEach(function(g){
      heading(P, g.name + '   ' + hrs(g.s.supply) + ' hr:min supply, ' + int(g.s.w) + ' feeders');
      table(P, FEEDER_HEAD, areaFeederRows(g.list), {cols:FEEDER_COLS, size:8.2, tight:true});
    });
  } else {
    var S2 = areaSum(all); areaFigures(P, S2, perDay);
    var ds = areaSort(areaGroups(all, 'district')), h3 = AREA_HEAD.slice(); h3[1] = 'District';
    table(P, h3, [areaTotal((discom || 'Bihar') + ' (all districts)', S2, uniq(all, function(f){ return f.discom; }))].concat(ds.map(function(g, i){ return areaRow(i + 1, g); })), {cols:AREA_COLS, size:8.4, tight:true, flow:true, pad:2.4});
    if (mode === 'detail') ds.forEach(function(g){
      P.doc.addPage(); P.y = 56;
      heading(P, g.name + ' district   ' + hrs(g.s.supply) + ' hr:min supply, ' + int(g.s.w) + ' feeders');
      var bl = areaSort(areaGroups(g.list, 'block')), hb = AREA_HEAD.slice(); hb[1] = 'Block';
      var rs = bl.map(function(b, i){ return areaRow(i + 1, b); });
      table(P, hb, [areaTotal(g.name + ' (all blocks)', g.s, g.dcs)].concat(rs, estRows(g.name, rs.length + 1)), {cols:AREA_COLS, size:8.4, tight:true, flow:true, pad:2.4});
    });
  }
  var nm = 'Supply_by_Area_' + where.join('_').replace(/[^0-9A-Za-z]+/g, '_') + (mode === 'detail' ? '_detail' : '') + '_' + String(upto[0] || '').replace(/[^0-9A-Za-z-]/g, '') + '.pdf';
  finish(P, nm.replace(/_+/g, '_'));
}
function runAreaPdf(mode){
  if (!AREA || AREA.empty){ toast('The figures are still loading. Try again in a moment.'); return; }
  toast('Making the PDF ...');
  pdfLibs().then(function(){
    try { pdfArea(mode); }
    catch (err){ note('pdf failed', err); toast('Could not make the PDF. Please try again.'); }
  }, function(err){ note('pdf tools did not load', err); toast('Could not make the PDF: check the internet connection and try again.'); });
}

var MAKERS = {daily:pdfDaily, avg:pdfAverage, feeders:pdfFeeders, bottom:pdfBottom};
function runPdf(kind){
  if (!DATA){ toast('The figures are still loading. Try again in a moment.'); return; }
  toast('Making the PDF ...');
  pdfLibs().then(function(){
    try { MAKERS[kind](); }
    catch (err){ note('pdf failed', err); toast('Could not make the PDF. Please try again.'); }
  }, function(err){ note('pdf tools did not load', err); toast('Could not make the PDF: check the internet connection and try again.'); });
}
/* the PDF menu */
(function(){
  var btn = document.getElementById('pdfBtn'), menu = document.getElementById('pdfMenu');
  function close(){ menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', function(e){ e.stopPropagation(); var open = menu.hidden; menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('button').focus(); });
  document.addEventListener('click', function(e){ if (!menu.hidden && !menu.contains(e.target)) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !menu.hidden){ close(); btn.focus(); } });
  Array.prototype.forEach.call(menu.querySelectorAll('button[data-pdf]'), function(b){
    b.addEventListener('click', function(){ close(); runPdf(b.getAttribute('data-pdf')); });
  });
})();

load();
AREA_STATE = 'loading'; loadArea(false);          // Supply by Area opens first: its figures are asked for at once
})();
